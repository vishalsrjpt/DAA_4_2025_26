# ============================================================
# nginx.conf — Frontend Web Server Configuration
# ============================================================
# This does two things:
#   1. Serves your static files (index.html, style.css, script.js)
#   2. Proxies /api/* requests to the Spring Boot backend
#
# WHY PROXY?
#   In Docker, the frontend container can't reach "localhost:8080"
#   because each container has its own network namespace.
#   Nginx forwards /api/* to http://backend:8080 — where "backend"
#   is the service name defined in docker-compose.yml.
# ============================================================

server {
    listen 80;
    server_name localhost;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # ── Serve static files ───────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API requests to Spring Boot ───────────────────
    # Any request to /api/* is forwarded to the backend service
    location /api/ {
        proxy_pass http://backend:8080/api/;

        # Pass original request headers to backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Handle CORS preflight requests
        proxy_set_header Origin $http_origin;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }
}