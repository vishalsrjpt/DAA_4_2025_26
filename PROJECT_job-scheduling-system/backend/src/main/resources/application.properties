# ============================================================
# Application Configuration - Job Scheduling System
# ============================================================
# Values use ${ENV_VAR:default} syntax:
#   - In Docker: read from environment variables (docker-compose.yml)
#   - Locally:   fall back to the hardcoded default after the colon
# ============================================================

server.port=8080

# ── MySQL ────────────────────────────────────────────────────
# Docker:  SPRING_DATASOURCE_URL points to "mysql" service (container name)
# Local:   Falls back to localhost:3306
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/job_scheduler_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Connection pool (important in Docker: MySQL may start slowly) ─
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# Application Name
spring.application.name=job-scheduler